name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Swift
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 编译
        run: swift build -c release
      - name: 构建 .app
        run: ./Scripts/build_app.sh release
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Mac图片与视频超分-${{ github.sha }}
          path: build/SnowLeopardVision.app
