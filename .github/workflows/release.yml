name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write   # 允许创建 Release 并上传资产
    env:
      # 手动触发时用输入的版本号；tag 推送时用 tag 名（去掉前缀 v）
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Swift
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装依赖
        run: bash Scripts/install_deps.sh

      - name: 构建 .app
        run: ./Scripts/build_app.sh release

      - name: 打包 DMG
        run: ./Scripts/make_release.sh

      - name: 上传 Release 资源
        uses: softprops/action-gh-release@v2
        with:
          # workflow_dispatch 触发时没有 tag，需显式指定，否则 action 报 "requires a tag"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: Mac图片与视频超分 ${{ env.VERSION }}
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
