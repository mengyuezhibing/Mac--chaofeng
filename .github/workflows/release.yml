name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Swift
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装依赖
        run: bash Scripts/install_deps.sh

      - name: 构建 .app
        run: ./Scripts/build_app.sh release

      - name: 打包 DMG
        run: ./Scripts/make_release.sh

      - name: 上传 Release 资源
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
